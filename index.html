<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Borang Pendaftaran</h1>
            <p>Sila isi maklumat anda di bawah untuk membuat pendaftaran.</p>
        </header>

        <main class="card">
            <div id="alert-box" class="alert hidden"></div>

            <form id="registration-form">
                <div class="form-group">
                    <label for="nama">Nama Penuh</label>
                    <input type="text" id="nama" name="nama" placeholder="Cth: Ahmad bin Abdullah" required>
                </div>

                <div class="form-group">
                    <label for="telefon">Nombor Telefon</label>
                    <input type="tel" id="telefon" name="telefon" placeholder="Cth: 0123456789" required>
                </div>

                <div class="form-group">
                    <label for="emel">Alamat E-mel</label>
                    <input type="email" id="emel" name="emel" placeholder="Cth: ahmad@example.com" required>
                </div>

                <div class="form-group">
                    <label for="statusJemaat">Status Jemaat</label>
                    <select id="statusJemaat" name="statusJemaat" required>
                        <option value="" disabled selected>-- Sila Pilih Status --</option>
                        <option value="Ya">Ya (Jemaat)</option>
                        <option value="Bukan">Bukan Jemaat</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary">Hantar Pendaftaran</button>
            </form>
        </main>

        <footer class="footer">
            <a href="admin.html" class="admin-link">Log Masuk Pentadbir</a>
        </footer>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
